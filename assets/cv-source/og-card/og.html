<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com" rel="preconnect">
<link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@700;800;900&family=Poppins:wght@500;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F0E17;
    --blue: #58B4FF;
    --violet: #B87AFF;
    --text: #E2E8F0;
    --muted: rgba(226,232,240,.62);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 1200px; height: 630px;
    background: var(--bg);
    font-family: 'Roboto', sans-serif;
    overflow: hidden;
    position: relative;
  }
  /* soft neon glows */
  .glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: .35;
  }
  .glow-1 { width: 520px; height: 520px; background: var(--blue); top: -180px; right: -120px; }
  .glow-2 { width: 460px; height: 460px; background: var(--violet); bottom: -200px; left: -140px; opacity: .28; }

  .wrap {
    position: relative;
    z-index: 2;
    padding: 76px 90px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .photo {
    width: 108px;
    height: 108px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--blue);
    margin-bottom: 28px;
  }

  h1 {
    font-family: 'Raleway', sans-serif;
    font-weight: 900;
    font-size: 64px;
    color: #fff;
    margin: 0 0 14px;
    letter-spacing: .5px;
    line-height: 1;
  }

  .role {
    font-family: 'Poppins', sans-serif;
    font-weight: 500;
    font-size: 24px;
    color: var(--blue);
    margin: 0 0 30px;
  }

  .flow {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 34px;
  }
  .flow-word {
    font-family: 'Raleway', sans-serif;
    font-weight: 700;
    font-size: 21px;
    color: var(--text);
  }
  .flow-word:first-child { color: var(--blue); }
  .flow-word:last-child { color: var(--violet); }
  .arrow { color: rgba(255,255,255,.28); font-size: 18px; }

  .tagline {
    font-size: 22px;
    line-height: 1.5;
    color: var(--muted);
    max-width: 760px;
    margin: 0 0 0;
  }

  .footer {
    position: absolute;
    bottom: 44px;
    left: 90px;
    right: 90px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .domain {
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 19px;
    color: #fff;
    letter-spacing: .3px;
  }
  .domain span { color: var(--blue); }
  .badge {
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 15px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid rgba(255,255,255,.18);
    padding: 8px 16px;
    border-radius: 20px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #58EBC8; }
</style>
</head>
<body>

  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="wrap">
    <img class="photo" src="../../img/my-profile-img.jpg" alt="">
    <h1>DANSAC Lucas</h1>
    <p class="role">Un profil qui relie plusieurs métiers</p>

    <div class="flow">
      <span class="flow-word">Stratégie</span><span class="arrow">›</span>
      <span class="flow-word">Projet</span><span class="arrow">›</span>
      <span class="flow-word">Création</span><span class="arrow">›</span>
      <span class="flow-word">Tech</span><span class="arrow">›</span>
      <span class="flow-word">Communication</span><span class="arrow">›</span>
      <span class="flow-word">Livraison</span>
    </div>

    <p class="tagline">Je pilote des projets, et je sais aussi mettre les mains dans la création quand il le faut.</p>
  </div>

  <div class="footer">
    <span class="domain">lucasdansac<span>.com</span></span>
    <span class="badge"><span class="dot"></span> Ouvert aux opportunités</span>
  </div>

</body>
</html>
